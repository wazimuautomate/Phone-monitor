name: Android APK

on:
  push:
    branches: [main, feature]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        working-directory: ${{ github.workspace }}
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK with a stable name
        working-directory: ${{ github.workspace }}
        run: cp app/capture/build/outputs/apk/debug/*.apk phone-monitor-capture.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-monitor-capture-debug
          path: phone-monitor-capture.apk
          if-no-files-found: error

      - name: Publish APK to the 'capture-latest' release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view capture-latest >/dev/null 2>&1 || \
            gh release create capture-latest \
              --title "Capture app (latest debug build)" \
              --notes "Auto-built debug APK from the latest push. Install on locked (Tier-2) phones." \
              --prerelease
          gh release upload capture-latest phone-monitor-capture.apk --clobber
