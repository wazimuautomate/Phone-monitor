name: Desktop EXE

on:
  push:
    branches: [main, feature]
    paths:
      - "desktop/**"
      - "helper/**"
      - "web/**"
      - "package.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows portable .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build web + helper + bundle desktop assets
        env:
          # Embedded read-only token so the installed app can read update
          # releases from the private repo. Empty if the secret is unset —
          # which just disables the in-app update check.
          RELEASES_READ_TOKEN: ${{ secrets.RELEASES_READ_TOKEN }}
        run: npm run prepare:desktop

      - name: Build installer + portable .exe
        run: npm run dist -w desktop

      # Name the artifact after the version so downloads are identifiable.
      - name: Read app version
        id: ver
        shell: bash
        run: |
          V=$(node -p "require('./desktop/package.json').version")
          test -n "$V" || { echo "could not read version"; exit 1; }
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "Desktop version: $V"

      # Update feed the installed app reads to detect newer versions.
      - name: Write desktop update feed
        shell: bash
        run: |
          V="${{ steps.ver.outputs.v }}"
          printf '{"version": "%s", "exe": "PhoneMonitor-Setup-%s.exe", "notes": "Phone Monitor %s"}\n' \
            "$V" "$V" "$V" > desktop/release/latest.json
          cat desktop/release/latest.json

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-monitor-desktop-${{ steps.ver.outputs.v }}
          path: desktop/release/*.exe
          if-no-files-found: error

      # Publish to the client update channel only from main (tested releases).
      - name: Publish .exe to the 'desktop-latest' release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest >/dev/null 2>&1 || \
            gh release create desktop-latest \
              --title "Phone Monitor Desktop (latest build)" \
              --notes "Auto-built Windows builds. PhoneMonitor-Setup-<version>.exe installs the app; PhoneMonitor-<version>-portable.exe runs without installing." \
              --prerelease
          # Delete first: --clobber alone intermittently 422s with
          # "ReleaseAsset.name already exists" and fails an otherwise-good build.
          for f in desktop/release/*.exe desktop/release/latest.json; do
            gh release delete-asset desktop-latest "$(basename "$f")" -y || true
          done
          gh release upload desktop-latest desktop/release/*.exe desktop/release/latest.json --clobber
