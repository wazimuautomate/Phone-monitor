name: CI

on:
  push:
    branches: [main, feature]
  pull_request:
    branches: [main]

jobs:
  desktop:
    name: Typecheck & build (helper + web)
    runs-on: ubuntu-latest
    # This job only builds helper + web; skip Electron's 100MB+ binary download
    # that the desktop workspace would otherwise trigger during npm ci.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w helper
      - run: npm run typecheck -w web
      - run: npm run typecheck -w relay
      - run: npm run build
