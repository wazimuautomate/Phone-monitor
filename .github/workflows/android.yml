name: Android APK

on:
  push:
    branches: [main, feature]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        working-directory: ${{ github.workspace }}
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK as phone-monitor.apk
        working-directory: ${{ github.workspace }}
        run: cp app/capture/build/outputs/apk/debug/*.apk phone-monitor.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-monitor
          path: phone-monitor.apk
          if-no-files-found: error

      - name: Publish APK to the 'capture-latest' release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view capture-latest >/dev/null 2>&1 || \
            gh release create capture-latest \
              --title "Phone Monitor (latest build)" \
              --notes "Auto-built APK from the latest push. Install on Tier-2 phones." \
              --prerelease
          # Drop the asset we're about to replace. --clobber alone intermittently
          # loses a race and fails the whole build with
          # "HTTP 422: ReleaseAsset.name already exists" — after the APK has
          # already built fine. Delete first, then upload.
          gh release delete-asset capture-latest phone-monitor.apk -y || true
          # Legacy name from older builds; harmless once it's gone.
          gh release delete-asset capture-latest phone-monitor-capture.apk -y || true
          gh release upload capture-latest phone-monitor.apk --clobber
